name: Build & Publish zed2api to GHCR

on:
  schedule:
    # 避开整点高峰（GitHub schedule 排队严重）
    - cron: '37 5 * * *'
  push:
    branches: ["main"]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      # ── 质量门禁：本地先编译运行 AMD64 镜像并探测健康检查，通过后才允许发布 ──
      - name: Build local test image (AMD64)
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64
          load: true
          tags: local-test:latest
          cache-from: type=gha

      - name: Pre-flight smoke test
        run: |
          set -euo pipefail
          docker run -d --name smoke-test -p 8001:8001 local-test:latest
          echo "Waiting for zed2api to become healthy..."
          passed=0
          for i in $(seq 1 30); do
            if curl -sS --fail http://127.0.0.1:8001/v1/models >/dev/null 2>&1; then
              echo "✅ Pre-flight smoke test passed on attempt $i!"
              passed=1
              break
            fi
            sleep 2
          done
          if [ "$passed" -ne 1 ]; then
            echo "❌ Service failed healthcheck, aborting publish to GHCR!"
            echo "--- Container logs ---"
            docker logs smoke-test 2>&1 || true
            docker rm -f smoke-test >/dev/null 2>&1 || true
            exit 1
          fi
          docker rm -f smoke-test >/dev/null 2>&1 || true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
